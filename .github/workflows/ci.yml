name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (LTS estável)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Validar Build e Tipos (Next.js & TypeScript)
        run: npm run build

      - name: Executar Harness de Testes (Vitest)
        run: npm test